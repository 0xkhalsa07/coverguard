name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the GitHub release and upload assets
  id-token: write        # required for build provenance attestation
  attestations: write    # record the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish GitHub release with artifacts and SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cyclonedx.json
